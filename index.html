<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鉄道完乗管理アプリ - Koh Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#0a0f1e">
    <style>
        :root {
            --bg: #0a0f1e;
            --surface: #111827;
            --surface2: #1a2235;
            --border: #1e3a5f;
            --accent: #38bdf8;
            --accent2: #818cf8;
            --accent-glow: rgba(56,189,248,0.15);
            --text: #e2e8f0;
            --text-muted: #64748b;
            --success: #34d399;
            --danger: #f87171;
            --gold: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(56,189,248,0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(129,140,248,0.05) 0%, transparent 50%);
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        /* ヘッダー */
        .app-header { text-align: center; padding: 28px 0 20px; }
        .app-header h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .app-header .subtitle {
            font-size: 11px;
            letter-spacing: 4px;
            color: var(--text-muted);
            margin-top: 4px;
            text-transform: uppercase;
        }

        /* ログイン画面 */
        #login-screen { display: flex; flex-direction: column; gap: 14px; max-width: 400px; margin: 20px auto; }
        .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px 28px; }
        #auth-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 22px;
            letter-spacing: 2px;
            color: var(--accent);
            text-align: center;
            margin-bottom: 24px;
            text-transform: uppercase;
        }
        .auth-input {
            width: 100%;
            padding: 13px 16px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 15px;
            font-family: 'Noto Sans JP', sans-serif;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 12px;
        }
        .auth-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .auth-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Noto Sans JP', sans-serif;
            transition: opacity 0.2s, transform 0.1s;
            letter-spacing: 1px;
        }
        .auth-btn:active { transform: scale(0.98); }
        .auth-btn-login { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0a0f1e; margin-top: 4px; }
        .auth-error { color: var(--danger); font-size: 12px; text-align: center; min-height: 18px; }
        .auth-switch { text-align: center; font-size: 13px; color: var(--text-muted); margin-top: 16px; }
        .auth-switch a { color: var(--accent); cursor: pointer; text-decoration: none; font-weight: 700; }

        /* ユーザーバー */
        #user-bar {
            display: none;
            justify-content: space-between;
            align-items: center;
            background: var(--surface2);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 12px;
            color: var(--text-muted);
        }
        #logout-btn {
            background: none;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Noto Sans JP', sans-serif;
        }

        /* 進捗 */
        .progress-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }
        .progress-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
        }
        .progress-label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
        .progress-pct {
            font-family: 'Rajdhani', sans-serif;
            font-size: 42px;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .progress-bar-bg { background: var(--surface2); height: 8px; border-radius: 4px; overflow: hidden; margin: 12px 0 6px; }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            border-radius: 4px;
            transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
            box-shadow: 0 0 10px var(--accent-glow);
        }
        .progress-km { font-size: 12px; color: var(--text-muted); }
        .sub-stats { display: flex; gap: 16px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
        .sub-stat { flex: 1; text-align: center; }
        .sub-stat-label { font-size: 10px; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; }
        .sub-stat-val { font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 700; color: var(--accent); }

        /* タブ */
        .tab-container {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 6px;
        }
        .tab-button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1px;
            font-family: 'Noto Sans JP', sans-serif;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .tab-button.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0a0f1e; }

        /* 入力フォーム */
        .input-group { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
        .input-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); margin: 16px 0 6px; display: block; }
        .input-label:first-of-type { margin-top: 0; }

        select, input[type="date"], input[type="text"], input[type="number"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 15px !important;
            font-family: 'Noto Sans JP', sans-serif;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            -webkit-appearance: none;
        }
        select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        select option { background: var(--surface2); }

        .flex-row { display: flex; gap: 10px; }
        .flex-row > div { flex: 1; }

        .submit-btn {
            margin-top: 20px;
            width: 100%;
            background: linear-gradient(135deg, var(--success), #059669);
            color: #0a0f1e;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Noto Sans JP', sans-serif;
            letter-spacing: 1px;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 20px rgba(52,211,153,0.2);
        }
        .submit-btn:active { transform: scale(0.98); }

        /* グラフ */
        .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
        .chart-title { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 14px; }
        .chart-controls { display: flex; justify-content: space-between; margin-bottom: 14px; }

        /* リスト */
        .list-header { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 10px; }
        .list-title { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); }
        .search-input { width: 48%; padding: 8px 14px !important; font-size: 13px !important; border-radius: 20px !important; }

        ul { list-style: none; padding: 0; }
        li {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 14px 16px;
            margin-bottom: 8px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
        }
        li:hover { border-color: var(--accent); }
        li .rec-date { font-size: 11px; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 3px; }
        li .rec-name { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
        li .rec-section { font-size: 12px; color: var(--accent); }

        .btn-small {
            background: var(--surface2);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Noto Sans JP', sans-serif;
            margin: 3px;
            transition: all 0.2s;
        }
        .btn-small:hover { border-color: var(--accent); color: var(--accent); }

        .backup-section { background: var(--surface); border: 1px dashed var(--border); border-radius: 16px; padding: 20px; text-align: center; margin-top: 16px; }
        .backup-title { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }

        /* 全線閲覧 */
        .company-title {
            margin-top: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            color: var(--accent);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .company-title small { font-size: 12px; color: var(--text-muted); font-weight: 400; }
        .line-card { padding: 14px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
        .line-name { font-size: 14px; font-weight: 700; transition: color 0.2s; }
        .line-card:hover .line-name { color: var(--accent); }
        .line-pct { font-size: 14px; font-weight: 700; color: var(--text-muted); }
        .line-pct.complete { color: var(--gold); }
        .badge-complete {
            background: rgba(251,191,36,0.15);
            color: var(--gold);
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 700;
            margin-left: 8px;
            border: 1px solid rgba(251,191,36,0.3);
        }
        .history-area { display: none; background: var(--surface2); padding: 12px; margin-top: 10px; font-size: 12px; border: 1px solid var(--border); border-radius: 10px; color: var(--text-muted); }
        .history-row { display: grid; grid-template-columns: 90px 1fr 16px 1fr 60px 44px; gap: 6px; align-items: center; border-bottom: 1px solid var(--border); padding: 6px 0; }
        .history-row .h-from { text-align: right; }
        .history-row .h-sep { text-align: center; color: var(--text-muted); }
        .history-row .h-to { text-align: left; }
        .history-row .h-dist { text-align: right; white-space: nowrap; }

        #show-all-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 13px;
            display: none;
            margin-top: 4px;
            transition: border-color 0.2s, background 0.2s;
        }
        #show-all-btn:hover { border-color: var(--accent); background: var(--accent-glow); }

        /* オンボーディング */
        #onboarding-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .onboarding-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px 28px;
            max-width: 400px;
            width: 100%;
            position: relative;
        }
        .onboarding-step { display: none; }
        .onboarding-step.active { display: block; }
        .onboarding-icon { font-size: 48px; text-align: center; margin-bottom: 16px; }
        .onboarding-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .onboarding-text { font-size: 14px; color: var(--text-muted); text-align: center; line-height: 1.7; margin-bottom: 24px; }
        .onboarding-dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 20px; }
        .onboarding-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); transition: background 0.2s; }
        .onboarding-dot.active { background: var(--accent); }
        .onboarding-btns { display: flex; gap: 10px; }
        .onboarding-btn-next {
            flex: 1;
            padding: 13px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #0a0f1e;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Noto Sans JP', sans-serif;
        }
        .onboarding-btn-skip {
            padding: 13px 16px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            font-family: 'Noto Sans JP', sans-serif;
        }
        #help-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Noto Sans JP', sans-serif;
            transition: border-color 0.2s, color 0.2s;
        }
        #help-btn:hover { border-color: var(--accent); color: var(--accent); }

        #loading { text-align: center; padding: 60px 20px; }
        .loading-dot { display: inline-block; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; margin: 0 4px; animation: pulse 1.2s ease-in-out infinite; }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; background: var(--accent2); }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse { 0%,80%,100%{opacity:0.2;transform:scale(0.8)} 40%{opacity:1;transform:scale(1)} }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <h1>🚃 Rail Tracker</h1>
        <div class="subtitle">鉄道完乗管理システム</div>
    </div>

    <div id="loading">
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
    </div>

    <!-- ログイン画面 -->
    <div id="login-screen" style="display:none;">
        <div class="login-card">
            <h2 id="auth-title">Login</h2>
            <input class="auth-input" type="email" id="auth-email" placeholder="メールアドレス">
            <input class="auth-input" type="password" id="auth-password" placeholder="パスワード（6文字以上）">
            <p class="auth-error" id="auth-error"></p>
            <button class="auth-btn auth-btn-login" id="auth-main-btn" onclick="authAction()">ログイン</button>
            <p class="auth-switch" id="auth-switch-text">
                アカウントがない方は <a onclick="toggleAuthMode()">新規登録</a>
            </p>
        </div>
    </div>

    <!-- メインアプリ -->
    <div id="main-app" style="display:none;">

        <div id="user-bar">
            <span id="user-email-label"></span>
            <div style="display:flex;gap:8px;align-items:center;">
                <button id="help-btn" onclick="openOnboarding()">？</button>
                <button id="logout-btn" onclick="logout()">ログアウト</button>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-label">全線踏破進捗</div>
            <div class="progress-pct" id="total-result">0.00%</div>
            <div class="progress-bar-bg"><div id="total-progress-bar" class="progress-bar-fill"></div></div>
            <div class="progress-km" id="total-stats">0 / 0 km</div>
            <div class="sub-stats" id="sub-stats"></div>
        </div>

        <div class="tab-container">
            <button id="btn-input" class="tab-button active" onclick="showPage('input')">記録入力</button>
            <button id="btn-view" class="tab-button" onclick="showPage('view')">全線閲覧</button>
            <button id="btn-ranking" class="tab-button" onclick="showPage('ranking')">ランキング</button>
            <button id="btn-settings" class="tab-button" onclick="showPage('settings')">設定</button>
        </div>

        <div id="page-input">
            <div class="input-group">
                <span class="input-label">鉄道会社</span>
                <select id="company-select" onchange="updateLineOptions()">
                    <option value="">--- 会社を選択してください ---</option>
                </select>
                <span class="input-label">路線</span>
                <select id="line-select" onchange="updateTotal()">
                    <option value="0">--- 先に会社を選んでください ---</option>
                </select>
                <span class="input-label">乗車日</span>
                <input type="date" id="ride-date">
                <div class="flex-row">
                    <div>
                        <span class="input-label">乗車駅（任意）</span>
                        <input type="text" id="ride-from" placeholder="例：新大阪" oninput="updateSection()">
                    </div>
                    <div>
                        <span class="input-label">降車駅（任意）</span>
                        <input type="text" id="ride-to" placeholder="例：東京" oninput="updateSection()">
                    </div>
                </div>
                <span class="input-label">乗車区間（自動入力）</span>
                <input type="text" id="ride-section" placeholder="自動入力されます" readonly style="opacity:0.5;">
                <div class="flex-row" style="margin-top:4px;">
                    <div>
                        <span class="input-label">全長 (km)</span>
                        <input type="number" id="total-dist" readonly style="opacity:0.5;" placeholder="自動入力">
                    </div>
                    <div>
                        <span class="input-label">今回の乗車 (km)</span>
                        <input type="number" id="ride-dist" step="0.1" inputmode="decimal" placeholder="例：13.2">
                    </div>
                </div>
                <button class="submit-btn" onclick="addRecord()">記録を保存する</button>
            </div>

            <div class="chart-card">
                <div class="chart-title">累計乗車距離の推移</div>
                <div class="chart-controls">
                    <div>
                        <button onclick="changeRange(3)" class="btn-small">3年</button>
                        <button onclick="changeRange(10)" class="btn-small">10年</button>
                        <button onclick="changeRange(0)" class="btn-small">全体</button>
                    </div>
                    <div>
                        <button id="prev-period" onclick="movePeriod(-1)" class="btn-small">＜前へ</button>
                        <button id="next-period" onclick="movePeriod(1)" class="btn-small">次へ＞</button>
                    </div>
                </div>
                <canvas id="ride-chart"></canvas>
            </div>

            <div class="chart-card">
                <div class="chart-title">年別乗車距離</div>
                <canvas id="yearly-chart"></canvas>
            </div>

            <div class="list-header">
                <span class="list-title">最近の記録</span>
                <input type="text" id="search-input" class="search-input" placeholder="路線を検索..." oninput="updateDisplay()">
            </div>
            <div style="display:flex;gap:6px;margin-bottom:10px;">
                <button onclick="setSortOrder('date-desc')" id="sort-date-desc" class="btn-small" style="color:var(--accent);border-color:var(--accent);">日付▼</button>
                <button onclick="setSortOrder('date-asc')" id="sort-date-asc" class="btn-small">日付▲</button>
                <button onclick="setSortOrder('name-asc')" id="sort-name-asc" class="btn-small">路線名順</button>
            </div>
            <ul id="record-list"></ul>
            <button id="show-all-btn" onclick="toggleShowAll()">すべての記録を表示する</button>

            <div class="backup-section">
                <div class="backup-title">データ管理</div>
                <button class="btn-small" onclick="exportData()">バックアップ保存</button>
                <label class="btn-small" style="cursor:pointer;">データ復旧<input type="file" style="display:none;" onchange="importData(event)"></label>
                <br>
                <button onclick="clearAll()" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:11px;margin-top:12px;font-family:'Noto Sans JP',sans-serif;">[全データを削除]</button>
            </div>
        </div>

        <div id="page-view" style="display:none;">
            <div style="margin-bottom:10px;">
                <input type="text" id="view-search" placeholder="会社名・路線名を検索..."
                    oninput="renderFullList()"
                    style="border-radius:20px;">
            </div>
            <div style="display:flex;gap:6px;margin-bottom:14px;">
                <button onclick="setViewFilter('all')" id="filter-all" class="btn-small" style="color:var(--accent);border-color:var(--accent);">すべて</button>
                <button onclick="setViewFilter('ridden')" id="filter-ridden" class="btn-small">乗車済み</button>
                <button onclick="setViewFilter('complete')" id="filter-complete" class="btn-small">完乗のみ</button>
                <button onclick="setViewFilter('unridden')" id="filter-unridden" class="btn-small">未乗のみ</button>
            </div>
            <div id="full-line-list"></div>
        </div>

        <!-- ランキング画面 -->
        <div id="page-ranking" style="display:none;">
            <div style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:16px;">全ユーザーランキング</div>
            <div id="ranking-list"></div>
        </div>

        <!-- 設定画面 -->
        <div id="page-settings" style="display:none;">
            <div class="card" style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;">
                <div style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:16px;">ニックネーム</div>
                <input type="text" id="nickname-input" placeholder="ニックネームを入力">
                <button onclick="saveNickname()" class="submit-btn" style="margin-top:12px;padding:12px;font-size:14px;">保存する</button>
            </div>
            <div class="card" style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;">
                <div style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:16px;">パスワード変更</div>
                <input type="password" id="new-password" placeholder="新しいパスワード（6文字以上）" style="margin-bottom:10px;">
                <input type="password" id="new-password-confirm" placeholder="新しいパスワード（確認）">
                <p id="password-msg" style="font-size:12px;text-align:center;min-height:18px;margin-top:8px;"></p>
                <button onclick="changePassword()" class="submit-btn" style="margin-top:4px;padding:12px;font-size:14px;background:linear-gradient(135deg,var(--accent2),#6366f1);">パスワードを変更する</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, updatePassword }
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, collection, getDocs }
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCi-0sXdMw0bNcQf4Xxeb_RqGh39ZZzXRg",
        authDomain: "railway-app-a9717.firebaseapp.com",
        projectId: "railway-app-a9717",
        storageBucket: "railway-app-a9717.firebasestorage.app",
        messagingSenderId: "554916843672",
        appId: "1:554916843672:web:f551631af738cdd35d40ed",
        measurementId: "G-7MD65RWQ45"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.trainRecords = [];
    window.masterLines = [];
    window.myChart = null;
    window.yearlyChart = null;
    window.editIndex = -1;
    window.isShowAll = false;
    window.currentRangeYears = 0;
    window.currentEndDate = new Date();
    window.sortOrder = 'date-desc';
    window.viewFilter = 'all';
    let currentUser = null;
    let isRegisterMode = false;

    onAuthStateChanged(auth, async (user) => {
        document.getElementById('loading').style.display = 'none';
        if (user) {
            currentUser = user;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('user-bar').style.display = 'flex';
            document.getElementById('user-email-label').textContent = user.email;
            await loadFromFirestore(user.uid);
            await loadNickname(user.uid);
            fetch('lines.json').then(r => r.json()).then(data => {
                window.masterLines = data;
                populateCompanySelect();
                updateDisplay();
            });
            document.getElementById('ride-date').valueAsDate = new Date();

            // 初回ログイン判定
            const seenKey = 'onboarding_seen_' + user.uid;
            if (!localStorage.getItem(seenKey)) {
                openOnboarding();
            }
        } else {
            currentUser = null;
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('main-app').style.display = 'none';
            document.getElementById('user-bar').style.display = 'none';
        }
    });

    async function loadFromFirestore(uid) {
        const snap = await getDoc(doc(db, "users", uid));
        window.trainRecords = snap.exists() ? (snap.data().records || []) : [];
    }

    window.save = async function() {
        if (!currentUser) return;
        await setDoc(doc(db, "users", currentUser.uid), { records: window.trainRecords });
        // ランキング用データも更新
        await updateRankingData();
    };

    async function updateRankingData() {
        if (!currentUser || !window.masterLines.length) return;
        let totalNet = 0, totalR = 0;
        window.masterLines.forEach(c => { totalNet += c.lines.reduce((s, l) => s + l.dist, 0); });
        window.trainRecords.forEach(r => { totalR += r.ride; });
        const pct = totalNet > 0 ? (totalR / totalNet) * 100 : 0;
        const nicknameEl = document.getElementById('nickname-input');
        const nickname = nicknameEl && nicknameEl.value ? nicknameEl.value : currentUser.email;

        // 会社別進捗を計算
        const companyProgress = window.masterLines.map(co => {
            let cTotal = 0, cRidden = 0;
            co.lines.forEach(l => {
                cTotal += l.dist;
                const r = window.trainRecords.filter(tr => tr.name === `${co.company} ${l.name}`).reduce((s, tr) => s + tr.ride, 0);
                cRidden += Math.min(r, l.dist);
            });
            const lines = co.lines.map(l => {
                const r = window.trainRecords.filter(tr => tr.name === `${co.company} ${l.name}`).reduce((s, tr) => s + tr.ride, 0);
                const p = Math.min((r / l.dist) * 100, 100);
                return { name: l.name, dist: l.dist, ridden: Math.min(r, l.dist), percent: p };
            }).filter(l => l.ridden > 0);
            return { company: co.company, total: cTotal, ridden: cRidden, percent: cTotal > 0 ? (cRidden / cTotal) * 100 : 0, lines };
        }).filter(c => c.ridden > 0);

        await setDoc(doc(db, "ranking", currentUser.uid), {
            nickname,
            totalKm: totalR,
            percent: pct,
            recordCount: window.trainRecords.length,
            companyProgress,
            updatedAt: new Date().toISOString()
        });
    }

    async function loadNickname(uid) {
        const snap = await getDoc(doc(db, "ranking", uid));
        if (snap.exists() && snap.data().nickname) {
            const el = document.getElementById('nickname-input');
            if (el) el.value = snap.data().nickname;
        }
    }

    window.saveNickname = async function() {
        if (!currentUser) return;
        const nickname = document.getElementById('nickname-input').value.trim();
        if (!nickname) { alert('ニックネームを入力してください'); return; }
        await updateRankingData();
        alert('ニックネームを保存しました！');
    };

    window.changePassword = async function() {
        const pw = document.getElementById('new-password').value;
        const pw2 = document.getElementById('new-password-confirm').value;
        const msg = document.getElementById('password-msg');
        if (pw.length < 6) { msg.style.color = 'var(--danger)'; msg.textContent = 'パスワードは6文字以上にしてください'; return; }
        if (pw !== pw2) { msg.style.color = 'var(--danger)'; msg.textContent = 'パスワードが一致しません'; return; }
        try {
            await updatePassword(currentUser, pw);
            msg.style.color = 'var(--success)';
            msg.textContent = 'パスワードを変更しました！';
            document.getElementById('new-password').value = '';
            document.getElementById('new-password-confirm').value = '';
        } catch(e) {
            msg.style.color = 'var(--danger)';
            msg.textContent = '変更に失敗しました。再ログインが必要な場合があります。';
        }
    };

    window.renderRanking = async function() {
        const cont = document.getElementById('ranking-list');
        if (!cont) return;
        cont.innerHTML = '<div style="color:var(--text-muted);font-size:12px;text-align:center;padding:20px;">読み込み中...</div>';
        const snap = await getDocs(collection(db, "ranking"));
        const users = [];
        snap.forEach(d => users.push({ uid: d.id, ...d.data() }));
        users.sort((a, b) => b.percent - a.percent);
        cont.innerHTML = '';
        users.forEach((u, i) => {
            const isMe = u.uid === currentUser.uid;
            const medals = ['🥇', '🥈', '🥉'];
            const rank = i < 3 ? medals[i] : `${i + 1}位`;
            const detailId = `detail-${u.uid}`;
            const div = document.createElement('div');
            div.style.cssText = `background:${isMe ? 'rgba(56,189,248,0.08)' : 'var(--surface)'};border:1px solid ${isMe ? 'var(--accent)' : 'var(--border)'};border-radius:12px;padding:14px 16px;margin-bottom:8px;cursor:pointer;`;

            // 会社別詳細HTML（ネストを避けるため文字列結合で生成）
            let companyHTML = '';
            if (u.companyProgress && u.companyProgress.length > 0) {
                // lines.jsonの順番を維持
                const sortedProgress = window.masterLines
                    .map(m => u.companyProgress.find(c => c.company === m.company))
                    .filter(Boolean);
                sortedProgress.forEach(co => {
                    let linesHTML = '';
                    co.lines.forEach(l => {
                        const lColor = l.percent >= 100 ? 'var(--gold)' : 'var(--text-muted)';
                        const lLabel = l.percent >= 100 ? ' 完乗' : '';
                        linesHTML += '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);padding:2px 0;border-bottom:1px solid var(--border);">'
                            + '<span>' + l.name + '</span>'
                            + '<span style="color:' + lColor + ';">' + l.percent.toFixed(1) + '%' + lLabel + '</span>'
                            + '</div>';
                    });
                    companyHTML += '<div style="margin-bottom:10px;">'
                        + '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">'
                        + '<span style="font-weight:700;color:var(--accent);">' + co.company + '</span>'
                        + '<span style="color:var(--text-muted);">' + co.percent.toFixed(1) + '% · ' + co.ridden.toFixed(1) + 'km</span>'
                        + '</div>'
                        + '<div style="background:var(--surface);height:4px;border-radius:2px;overflow:hidden;margin-bottom:6px;">'
                        + '<div style="height:100%;width:' + co.percent + '%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;"></div>'
                        + '</div>'
                        + linesHTML
                        + '</div>';
                });
            } else {
                companyHTML = '<div style="color:var(--text-muted);font-size:12px;padding:8px 0;">記録なし</div>';
            }

            div.innerHTML = `
                <div onclick="toggleRankDetail('${detailId}')">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <div style="display:flex;align-items:center;gap:12px;">
                            <span style="font-family:'Rajdhani',sans-serif;font-size:20px;">${rank}</span>
                            <div>
                                <div style="font-weight:700;font-size:14px;">${u.nickname}${isMe ? ' <span style="font-size:10px;color:var(--accent);">（あなた）</span>' : ''}</div>
                                <div style="font-size:11px;color:var(--text-muted);">${u.recordCount}件 · ${u.totalKm.toFixed(1)}km</div>
                            </div>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px;">
                            <span style="font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;color:${isMe ? 'var(--accent)' : 'var(--text)'};">${u.percent.toFixed(1)}%</span>
                            <span id="arrow-rank-${detailId}" style="font-size:11px;color:var(--text-muted);transition:transform 0.2s;">▼</span>
                        </div>
                    </div>
                    <div style="background:var(--surface2);height:4px;border-radius:2px;margin-top:10px;overflow:hidden;">
                        <div style="height:100%;width:${u.percent}%;background:${isMe ? 'linear-gradient(90deg,var(--accent),var(--accent2))' : 'var(--border)'};border-radius:2px;"></div>
                    </div>
                </div>
                <div id="${detailId}" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);">
                    <div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px;">路線別進捗</div>
                    ${companyHTML}
                </div>`;
            cont.appendChild(div);
        });
        if (users.length === 0) {
            cont.innerHTML = '<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:40px;">まだデータがありません</div>';
        }
    };

    // オンボーディング
    const TOTAL_STEPS = 5;
    let currentOnboardingStep = 0;

    window.openOnboarding = function() {
        currentOnboardingStep = 0;
        updateOnboardingUI();
        document.getElementById('onboarding-overlay').style.display = 'flex';
    };

    window.closeOnboarding = function() {
        document.getElementById('onboarding-overlay').style.display = 'none';
        if (currentUser) {
            localStorage.setItem('onboarding_seen_' + currentUser.uid, '1');
        }
    };

    window.nextOnboardingStep = function() {
        if (currentOnboardingStep < TOTAL_STEPS - 1) {
            currentOnboardingStep++;
            updateOnboardingUI();
        } else {
            closeOnboarding();
        }
    };

    function updateOnboardingUI() {
        document.querySelectorAll('.onboarding-step').forEach((el, i) => {
            el.classList.toggle('active', i === currentOnboardingStep);
        });
        // ドット生成
        const dots = document.getElementById('onboarding-dots');
        dots.innerHTML = '';
        for (let i = 0; i < TOTAL_STEPS; i++) {
            const dot = document.createElement('div');
            dot.className = 'onboarding-dot' + (i === currentOnboardingStep ? ' active' : '');
            dots.appendChild(dot);
        }
        // ボタンテキスト
        const nextBtn = document.getElementById('onboarding-next-btn');
        const skipBtn = document.querySelector('.onboarding-btn-skip');
        nextBtn.textContent = currentOnboardingStep === TOTAL_STEPS - 1 ? 'はじめる！' : '次へ →';
        skipBtn.style.display = currentOnboardingStep === TOTAL_STEPS - 1 ? 'none' : 'block';
    }

    // オーバーレイ背景クリックで閉じる
    document.getElementById('onboarding-overlay').addEventListener('click', function(e) {
        if (e.target === this) closeOnboarding();
    });

    window.toggleRankDetail = function(id) {
        const el = document.getElementById(id);
        const arrow = document.getElementById('arrow-rank-' + id);
        const isOpen = el.style.display === 'block';
        el.style.display = isOpen ? 'none' : 'block';
        if (arrow) arrow.style.transform = isOpen ? '' : 'rotate(180deg)';
    };

    window.authAction = async function() {
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        const errEl = document.getElementById('auth-error');
        errEl.textContent = '';
        if (!email || !password) { errEl.textContent = 'メールアドレスとパスワードを入力してください'; return; }
        try {
            if (isRegisterMode) await createUserWithEmailAndPassword(auth, email, password);
            else await signInWithEmailAndPassword(auth, email, password);
        } catch (e) {
            const msgs = {
                'auth/invalid-email': 'メールアドレスの形式が正しくありません',
                'auth/user-not-found': 'ユーザーが見つかりません',
                'auth/wrong-password': 'パスワードが間違っています',
                'auth/email-already-in-use': 'このメールアドレスは既に使用されています',
                'auth/weak-password': 'パスワードは6文字以上にしてください',
                'auth/invalid-credential': 'メールアドレスまたはパスワードが間違っています',
            };
            errEl.textContent = msgs[e.code] || 'エラーが発生しました';
        }
    };

    window.logout = async function() { await signOut(auth); window.trainRecords = []; };

    window.toggleAuthMode = function() {
        isRegisterMode = !isRegisterMode;
        document.getElementById('auth-title').textContent = isRegisterMode ? 'Register' : 'Login';
        document.getElementById('auth-main-btn').textContent = isRegisterMode ? '登録する' : 'ログイン';
        document.getElementById('auth-switch-text').innerHTML = isRegisterMode
            ? 'すでにアカウントをお持ちの方は <a onclick="toggleAuthMode()">ログイン</a>'
            : 'アカウントがない方は <a onclick="toggleAuthMode()">新規登録</a>';
        document.getElementById('auth-error').textContent = '';
    };

    window.showPage = function(pageId) {
        ['input','view','ranking','settings'].forEach(p => {
            document.getElementById('page-' + p).style.display = p === pageId ? 'block' : 'none';
            document.getElementById('btn-' + p).classList.toggle('active', p === pageId);
        });
        if (pageId === 'view') renderFullList();
        if (pageId === 'input') updateChart();
        if (pageId === 'ranking') renderRanking();
        if (pageId === 'settings') loadNickname(currentUser.uid);
    };

    window.updateSection = function() {
        const from = document.getElementById('ride-from').value.trim();
        const to = document.getElementById('ride-to').value.trim();
        const section = document.getElementById('ride-section');
        if (from && to) section.value = from + '〜' + to;
        else if (from) section.value = from;
        else section.value = '';
    };

    window.populateCompanySelect = function() {
        const sel = document.getElementById('company-select');
        window.masterLines.forEach((item, i) => {
            const opt = document.createElement('option');
            opt.value = i; opt.textContent = item.company;
            sel.appendChild(opt);
        });
    };

    window.updateLineOptions = function() {
        const idx = document.getElementById('company-select').value;
        const sel = document.getElementById('line-select');
        sel.innerHTML = '<option value="0">--- 路線を選択してください ---</option>';
        if (idx === "") return;
        window.masterLines[idx].lines.forEach(line => {
            const opt = document.createElement('option');
            opt.value = line.dist;
            opt.textContent = `${line.name} (${line.dist}km)`;
            sel.appendChild(opt);
        });
    };

    window.updateTotal = function() {
        const val = document.getElementById('line-select').value;
        document.getElementById('total-dist').value = val === "0" ? "" : val;
    };

    window.addRecord = async function() {
        const cSel = document.getElementById('company-select');
        const lSel = document.getElementById('line-select');
        const rDist = parseFloat(document.getElementById('ride-dist').value);
        const rDate = document.getElementById('ride-date').value;
        const rSect = document.getElementById('ride-section').value;
        if (cSel.value === "" || isNaN(rDist) || !rDate) { alert("入力に不足があります"); return; }
        const lineNameOnly = lSel.options[lSel.selectedIndex].text.split(' (')[0];
        const newData = {
            name: `${cSel.options[cSel.selectedIndex].text} ${lineNameOnly}`,
            total: parseFloat(document.getElementById('total-dist').value),
            ride: rDist, date: rDate,
            section: rSect || "（区間未入力）"
        };
        if (window.editIndex === -1) {
            window.trainRecords.push(newData);
        } else {
            window.trainRecords[window.editIndex] = newData;
            window.editIndex = -1;
            const btn = document.querySelector('.submit-btn');
            btn.textContent = "記録を保存する";
            btn.style.background = "linear-gradient(135deg, var(--success), #059669)";
        }
        await window.save();
        updateDisplay();
        document.getElementById('ride-dist').value = "";
        document.getElementById('ride-from').value = "";
        document.getElementById('ride-to').value = "";
        document.getElementById('ride-section').value = "";
        document.activeElement.blur();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        alert("保存が完了しました！");
    };

    window.updateDisplay = function() {
        if (!window.masterLines || window.masterLines.length === 0) return;
        const list = document.getElementById('record-list');
        const searchVal = document.getElementById('search-input') ? document.getElementById('search-input').value.toLowerCase() : "";
        if (!list) return;
        list.innerHTML = "";

        let totalNet = 0, jrNet = 0, pvtNet = 0;
        window.masterLines.forEach(c => {
            const d = c.lines.reduce((s, l) => s + l.dist, 0);
            totalNet += d;
            if (c.category === "JR") jrNet += d; else pvtNet += d;
        });

        let totalR = 0, jrR = 0, pvtR = 0;
        window.trainRecords.forEach(rec => {
            const c = window.masterLines.find(c => rec.name.startsWith(c.company));
            totalR += rec.ride;
            if (c && c.category === "JR") jrR += rec.ride; else pvtR += rec.ride;
        });

        const totalP = totalNet > 0 ? (totalR / totalNet) * 100 : 0;
        document.getElementById('total-result').innerText = totalP.toFixed(2) + "%";
        document.getElementById('total-stats').innerText = `${totalR.toFixed(1)} / ${totalNet.toFixed(1)} km`;
        document.getElementById('total-progress-bar').style.width = totalP + "%";

        const jrP = jrNet > 0 ? (jrR / jrNet) * 100 : 0;
        const pvtP = pvtNet > 0 ? (pvtR / pvtNet) * 100 : 0;
        document.getElementById('sub-stats').innerHTML = `
            <div class="sub-stat"><div class="sub-stat-label">JR</div><div class="sub-stat-val">${jrP.toFixed(1)}%</div><div style="font-size:10px;color:var(--text-muted)">${jrR.toFixed(1)}km</div></div>
            <div class="sub-stat"><div class="sub-stat-label">私鉄</div><div class="sub-stat-val">${pvtP.toFixed(1)}%</div><div style="font-size:10px;color:var(--text-muted)">${pvtR.toFixed(1)}km</div></div>
            <div class="sub-stat"><div class="sub-stat-label">記録数</div><div class="sub-stat-val">${window.trainRecords.length}</div><div style="font-size:10px;color:var(--text-muted)">件</div></div>`;

        let filtered = window.trainRecords.map((r, i) => ({ ...r, originalIndex: i }))
            .filter(r => r.name.toLowerCase().includes(searchVal) || r.section.toLowerCase().includes(searchVal));

        // 並び替え
        if (window.sortOrder === 'date-desc') filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
        else if (window.sortOrder === 'date-asc') filtered.sort((a, b) => new Date(a.date) - new Date(b.date));
        else if (window.sortOrder === 'name-asc') filtered.sort((a, b) => a.name.localeCompare(b.name, 'ja'));

        const display = !window.isShowAll && searchVal === "" ? filtered.slice(0, 10) : filtered;

        display.forEach(rec => {
            const li = document.createElement('li');
            li.innerHTML = `
                <div>
                    <div class="rec-date">${rec.date}</div>
                    <div class="rec-name">${rec.name}</div>
                    <div class="rec-section">${rec.section} · ${rec.ride}km</div>
                </div>
                <div style="display:flex;flex-direction:column;gap:4px;">
                    <button onclick="edit(${rec.originalIndex})" class="btn-small" style="color:var(--gold);border-color:rgba(251,191,36,0.4);">編集</button>
                    <button onclick="del(${rec.originalIndex})" class="btn-small" style="color:var(--danger);border-color:rgba(248,113,113,0.4);">削除</button>
                </div>`;
            list.appendChild(li);
        });

        const btn = document.getElementById('show-all-btn');
        if (btn) {
            if (searchVal !== "") { btn.style.display = "none"; }
            else if (filtered.length > 10) {
                btn.style.display = "block";
                btn.textContent = window.isShowAll ? "表示件数を戻す" : `すべての記録を表示する（${filtered.length}件）`;
            } else { btn.style.display = "none"; }
        }
        updateChart();
        updateYearlyChart();
    };

    window.toggleShowAll = function() { window.isShowAll = !window.isShowAll; updateDisplay(); };

    window.setSortOrder = function(order) {
        window.sortOrder = order;
        ['date-desc','date-asc','name-asc'].forEach(o => {
            const btn = document.getElementById('sort-' + o);
            if (btn) {
                btn.style.color = o === order ? 'var(--accent)' : 'var(--text-muted)';
                btn.style.borderColor = o === order ? 'var(--accent)' : 'var(--border)';
            }
        });
        updateDisplay();
    };

    window.setViewFilter = function(filter) {
        window.viewFilter = filter;
        ['all','ridden','complete','unridden'].forEach(f => {
            const btn = document.getElementById('filter-' + f);
            if (btn) {
                btn.style.color = f === filter ? 'var(--accent)' : 'var(--text-muted)';
                btn.style.borderColor = f === filter ? 'var(--accent)' : 'var(--border)';
            }
        });
        renderFullList();
    };

    window.edit = function(idx) {
        const rec = window.trainRecords[idx];
        window.editIndex = idx;
        const cIdx = window.masterLines.findIndex(c => c.company === rec.name.split(' ')[0]);
        if (cIdx !== -1) {
            document.getElementById('company-select').value = cIdx;
            window.updateLineOptions();
            const lSel = document.getElementById('line-select');
            for (let i = 0; i < lSel.options.length; i++) {
                if (rec.name.includes(lSel.options[i].text.split(' (')[0])) { lSel.selectedIndex = i; break; }
            }
        }
        document.getElementById('ride-date').value = rec.date;
        document.getElementById('ride-section').value = rec.section;
        const parts = rec.section.split('〜');
        document.getElementById('ride-from').value = parts[0] || '';
        document.getElementById('ride-to').value = parts[1] || '';
        document.getElementById('total-dist').value = rec.total;
        document.getElementById('ride-dist').value = rec.ride;
        const btn = document.querySelector('.submit-btn');
        btn.textContent = "変更を上書き保存する";
        btn.style.background = "linear-gradient(135deg, #fbbf24, #f59e0b)";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.del = async function(idx) {
        if (confirm("削除しますか？")) { window.trainRecords.splice(idx, 1); await window.save(); updateDisplay(); }
    };

    window.exportData = function() {
        const blob = new Blob([JSON.stringify(window.trainRecords, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'train_records.json'; a.click();
    };

    window.importData = async function(e) {
        const reader = new FileReader();
        reader.onload = async (ev) => { window.trainRecords = JSON.parse(ev.target.result); await window.save(); updateDisplay(); alert("復旧完了"); };
        reader.readAsText(e.target.files[0]);
    };

    window.clearAll = async function() {
        if (confirm("全消去しますか？")) { window.trainRecords = []; await window.save(); updateDisplay(); }
    };

    window.changeRange = function(y) { window.currentRangeYears = y; window.currentEndDate = new Date(); updateDisplay(); };
    window.movePeriod = function(d) {
        if (window.currentRangeYears === 0) return;
        window.currentEndDate.setFullYear(window.currentEndDate.getFullYear() + d * window.currentRangeYears);
        updateDisplay();
    };

    function updateChart() {
        const ctx = document.getElementById('ride-chart').getContext('2d');
        const sorted = [...window.trainRecords].sort((a, b) => new Date(a.date) - new Date(b.date));
        let sum = 0;
        let all = sorted.map(r => { sum += r.ride; return { x: r.date, y: sum }; });
        let data = all;
        if (window.currentRangeYears > 0) {
            const start = new Date(window.currentEndDate);
            start.setFullYear(start.getFullYear() - window.currentRangeYears);
            data = all.filter(p => { const d = new Date(p.x); return d >= start && d <= window.currentEndDate; });
            const sv = all.filter(p => new Date(p.x) < start).pop();
            if (sv) data.unshift({ x: start.toISOString().split('T')[0], y: sv.y });
        }
        if (window.myChart) window.myChart.destroy();
        window.myChart = new Chart(ctx, {
            type: 'line',
            data: { datasets: [{ label: '累計(km)', data, borderColor: '#38bdf8', fill: true, backgroundColor: 'rgba(56,189,248,0.08)', tension: 0.3, pointRadius: 2, borderWidth: 2 }] },
            options: {
                scales: {
                    x: { type: 'time', time: { unit: 'year' }, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b' } },
                    y: { beginAtZero: false, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b' } }
                },
                plugins: { legend: { display: false } }
            }
        });
        document.getElementById('prev-period').disabled = window.currentRangeYears === 0;
        document.getElementById('next-period').disabled = window.currentRangeYears === 0;
    }

    function updateYearlyChart() {
        const ctx = document.getElementById('yearly-chart').getContext('2d');
        const yearly = {};
        window.trainRecords.forEach(r => { const y = new Date(r.date).getFullYear(); yearly[y] = (yearly[y] || 0) + r.ride; });
        const data = Object.keys(yearly).sort().map(y => ({ year: y, distance: yearly[y] }));
        if (window.yearlyChart) window.yearlyChart.destroy();
        window.yearlyChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: data.map(d => d.year),
                datasets: [{ label: '年間乗車距離(km)', data: data.map(d => d.distance), backgroundColor: 'rgba(129,140,248,0.6)', borderColor: '#818cf8', borderWidth: 1, borderRadius: 6 }]
            },
            options: {
                scales: {
                    y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b' } },
                    x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b' } }
                },
                plugins: { legend: { display: false } },
                onClick: (e, elements) => {
                    if (elements.length === 0) {
                        document.getElementById('yearly-detail').style.display = 'none';
                        return;
                    }
                    const idx = elements[0].index;
                    const year = data[idx].year;
                    showYearlyDetail(year);
                }
            }
        });
    }

    window.showYearlyDetail = function(year) {
        const detail = document.getElementById('yearly-detail');
        const title = document.getElementById('yearly-detail-title');
        const list = document.getElementById('yearly-detail-list');
        const recs = window.trainRecords.filter(r => new Date(r.date).getFullYear() == year);
        recs.sort((a, b) => new Date(a.date) - new Date(b.date));
        title.textContent = year + '年の乗車記録';
        list.innerHTML = '';
        if (recs.length === 0) {
            list.innerHTML = '<div style="color:var(--text-muted);font-size:12px;">記録なし</div>';
        } else {
            recs.forEach(r => {
                const div = document.createElement('div');
                div.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;';
                div.innerHTML = '<span style="color:var(--text-muted);width:88px;flex-shrink:0;">' + r.date + '</span>'
                    + '<span style="flex:1;padding:0 8px;">' + r.name + '</span>'
                    + '<span style="color:var(--accent);white-space:nowrap;">' + r.ride + 'km</span>';
                list.appendChild(div);
            });
        }
        detail.style.display = 'block';
    };

    window.renderFullList = function() {
        const cont = document.getElementById('full-line-list');
        if (!cont) return;
        cont.innerHTML = "";
        const searchEl = document.getElementById('view-search');
        const q = searchEl ? searchEl.value.toLowerCase() : '';
        const filter = window.viewFilter || 'all';
        window.masterLines.forEach((co, cIdx) => {
            // 検索フィルター
            const companyMatch = co.company.toLowerCase().includes(q);
            let matchedLines = q ? co.lines.filter(l => companyMatch || l.name.toLowerCase().includes(q)) : co.lines;

            // 完乗・未乗フィルター
            matchedLines = matchedLines.filter(l => {
                const tname = co.company + ' ' + l.name;
                const rd = window.trainRecords.filter(tr => tr.name === tname).reduce((s, tr) => s + tr.ride, 0);
                const p = Math.min((rd / l.dist) * 100, 100);
                if (filter === 'complete') return p >= 100;
                if (filter === 'unridden') return rd === 0;
                if (filter === 'ridden') return rd > 0;
                return true;
            });

            if (matchedLines.length === 0) return;
            let total = 0, ridden = 0;
            co.lines.forEach(l => {
                total += l.dist;
                const r = window.trainRecords.filter(tr => tr.name === `${co.company} ${l.name}`).reduce((s, tr) => s + tr.ride, 0);
                ridden += Math.min(r, l.dist);
            });
            const pct = total > 0 ? (ridden / total) * 100 : 0;
            const companyId = `company-${cIdx}`;

            // 会社ヘッダー（クリックで折りたたみ）
            const h4 = document.createElement('h4');
            h4.className = "company-title";
            h4.style.cursor = "pointer";
            h4.onclick = () => toggleCompany(companyId);
            h4.innerHTML = `
                <span>${co.company}</span>
                <span style="display:flex;align-items:center;gap:10px;">
                    <small>${pct.toFixed(1)}% (${ridden.toFixed(1)}/${total.toFixed(1)}km)</small>
                    <span id="arrow-${companyId}" style="font-size:12px;color:var(--accent);transition:transform 0.2s;">▼</span>
                </span>`;
            cont.appendChild(h4);

            // 路線リストのコンテナ（デフォルトは閉じた状態）
            const linesContainer = document.createElement('div');
            linesContainer.id = companyId;
            linesContainer.style.display = 'none';

            // 検索中は自動展開
            if (q) linesContainer.style.display = 'block';

            matchedLines.forEach((line) => {
                const lIdx = co.lines.indexOf(line);
                const tname = `${co.company} ${line.name}`;
                const hist = window.trainRecords.filter(r => r.name === tname).sort((a, b) => new Date(a.date) - new Date(b.date));
                const rd = hist.reduce((s, r) => s + r.ride, 0);
                const p = Math.min((rd / line.dist) * 100, 100);
                const isComplete = p >= 100;
                const id = `h-${cIdx}-${lIdx}`;
                const card = document.createElement('div');
                card.className = "line-card";
                card.innerHTML = `
                    <div onclick="toggleCard('${id}')">
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <span class="line-name">${line.name}${isComplete ? '<span class="badge-complete">完乗済</span>' : ''}</span>
                            <span class="line-pct${isComplete ? ' complete' : ''}">${p.toFixed(1)}%</span>
                        </div>
                        <div class="progress-bar-bg" style="height:4px;margin:6px 0;">
                            <div class="progress-bar-fill" style="width:${p}%;background:${isComplete ? 'var(--gold)' : 'linear-gradient(90deg,var(--accent),var(--accent2))'}"></div>
                        </div>
                        <div style="font-size:11px;color:var(--text-muted);">${rd.toFixed(1)}km / ${line.dist}km</div>
                    </div>
                    <div id="${id}" class="history-area">
                        <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;">乗車履歴</div>
                        ${hist.length > 0 ? hist.map((h, hi) => {
                            const parts = h.section.split('〜');
                            const from = parts[0] ? parts[0].trim() : '';
                            const to = parts[1] ? parts[1].trim() : '';
                            const origIdx = window.trainRecords.indexOf(h);
                            const sectionDisplay = to
                                ? `<span class="h-from">${from}</span><span class="h-sep">〜</span><span class="h-to">${to}</span>`
                                : `<span class="h-from" style="grid-column:span 3">${from}</span>`;
                            return `<div class="history-row">
                                <span style="color:var(--text-muted);font-size:11px;">${h.date}</span>
                                ${sectionDisplay}
                                <span class="h-dist" style="color:var(--accent)">${h.ride}km</span>
                                <button onclick="editFromView(${origIdx})" style="background:none;border:1px solid rgba(251,191,36,0.4);color:var(--gold);border-radius:4px;padding:2px 8px;font-size:10px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;">編集</button>
                            </div>`;
                        }).join('') : '<div style="color:var(--text-muted);font-size:12px;padding:4px 0;">履歴なし</div>'}
                    </div>`;
                linesContainer.appendChild(card);
            });
            cont.appendChild(linesContainer);
        });
    };

    window.toggleCard = function(id) {
        const el = document.getElementById(id);
        el.style.display = el.style.display === 'block' ? 'none' : 'block';
    };

    window.editFromView = function(idx) {
        // 記録入力タブに切り替えてから編集モードに
        showPage('input');
        setTimeout(() => edit(idx), 100);
    };

    window.toggleCompany = function(id) {
        const el = document.getElementById(id);
        const arrow = document.getElementById('arrow-' + id);
        const isOpen = el.style.display === 'block';
        el.style.display = isOpen ? 'none' : 'block';
        arrow.style.transform = isOpen ? '' : 'rotate(180deg)';
    };
</script>
</body>
</html>
